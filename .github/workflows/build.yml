name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        run: |
          ZIP=$(ls project.zip aero-project.zip 2>/dev/null | head -n1)
          if [ -z "$ZIP" ]; then echo "project.zip not found in repo root"; exit 1; fi
          unzip -o "$ZIP"
          SITE=$(tr -d '[:space:]' < site.txt)
          sed -i "s|https://YOUR-SITE.pages.dev|$SITE|" app/src/main/java/com/aero/store/MainActivity.java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug --no-daemon
      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Aero-Store.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          files: Aero-Store.apk
          fail_on_unmatched_files: true
